name: Render OpenAPI Probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/render-openapi-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List relevant live routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 15 --max-time 60 https://takeoff-virality-engine.onrender.com/openapi.json -o /tmp/openapi.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/openapi.json'))
          for p,methods in sorted(j.get('paths',{}).items()):
              if any(k in p.lower() for k in ('viral','media','analy','reel','video','insight','job')):
                  print(p, sorted(methods.keys()))
          PY
