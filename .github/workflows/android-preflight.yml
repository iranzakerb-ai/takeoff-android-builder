name: TakeOff Android Compile Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify v0.14.2 Vercel Job API contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "0.14.2"' app/build.gradle.kts
          grep -q 'https://takeoff-seven-puce.vercel.app' "$SRC/PayloadClient.kt"
          test -s "$SRC/ViralJobClient.kt"
          test -s "$SRC/ViralStreamClient.kt"
          grep -q '/v2/viral-jobs' "$SRC/ViralJobClient.kt"
          grep -q '/poll' "$SRC/ViralJobClient.kt"
          grep -q 'ViralJobClient.analyze(PayloadClient.PRODUCTION_ENDPOINT' "$SRC/ViralShareActivity.kt"
          grep -q 'const val PRODUCTION_ENDPOINT = PayloadClient.PRODUCTION_ENDPOINT' "$SRC/ViralStreamClient.kt"
          ! grep -Rni 'android.permission.RECORD_AUDIO' app/src/main
