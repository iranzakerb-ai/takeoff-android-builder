name: TakeOff Android Compile Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify expected job API client contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'
          test -s "$SRC/ViralJobClient.kt"
          test ! -e "$SRC/ViralStreamClient.kt"
          grep -q '/v2/viral-jobs' "$SRC/ViralJobClient.kt"
          grep -q 'ViralJobClient.start' "$SRC/ViralShareActivity.kt"
          grep -q 'ViralJobClient.poll' "$SRC/ViralShareActivity.kt"
          ! grep -Rni '/v2/viral-stream' "$SRC"
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
