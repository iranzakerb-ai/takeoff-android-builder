name: Android self-hosted validation

on:
  workflow_dispatch:
  push:
    branches: [codex/android-validation-only-20261108]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, takeoff-android]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: Install required Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
