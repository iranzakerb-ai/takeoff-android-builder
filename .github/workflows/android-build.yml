name: TakeOff Android Permanent Build

# final v0.14.1 code29 validation trigger 2026-08-29
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: takeoff-android-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Secret-free stateless Job API source gate
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'
          if grep -RniE --exclude-dir=.git --exclude='*.md' --exclude='*Test.kt' '(TAKEOFF_COMPANION_KEY[[:space:]]*=|TAKEOFF_COMPANION_BOOTSTRAP_CODE[[:space:]]*=|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})' .; then echo 'Potential secret found in public builder source' >&2; exit 1; fi
          ! grep -Rni 'SilentPairActivity' app/src/main
          ! grep -Rni 'android.permission.RECORD_AUDIO' app/src/main
          test ! -e "$SRC/LegacyCompanionRepair.kt"
          test ! -e "$SRC/ViralStreamClient.kt"
          if grep -RniE 'LegacyCompanionRepair|کد اتصال امن|/v2/viral-evidence/pair|/v2/viral-stream' "$SRC"; then echo 'Forbidden legacy/stream route found' >&2; exit 1; fi
          grep -q 'https://takeoff-seven-puce.vercel.app' "$SRC/PayloadClient.kt"
          ! grep -q 'takeoff-virality-engine.onrender.com' "$SRC/PayloadClient.kt"
          grep -q '/v2/viral-jobs' "$SRC/ViralJobClient.kt"
          grep -q '/poll' "$SRC/ViralJobClient.kt"
          grep -q 'ConcurrentHashMap' "$SRC/ViralJobClient.kt"
          grep -q 'rotatingTokens' "$SRC/ViralJobClient.kt"
          grep -q 'ViralJobClient.start' "$SRC/ViralShareActivity.kt"
          grep -q 'ViralJobClient.poll' "$SRC/ViralShareActivity.kt"
          grep -q 'stage_progress_percent' "$SRC/ViralShareActivity.kt"
          grep -q 'overall_progress_percent' "$SRC/ViralShareActivity.kt"
          for s in server_prepare media_resolve media_download ai_upload audio_visual_analysis behavioral_analysis learning_persist; do grep -q "$s" "$SRC/ViralShareActivity.kt"; done

      - name: Live production full Reel autopsy contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          BASE='https://takeoff-seven-puce.vercel.app'
          REEL='https://www.instagram.com/reel/DcasYHfqh93/'
          stages={'server_prepare','media_resolve','media_download','ai_upload','audio_visual_analysis','behavioral_analysis','learning_persist','completed','failed'}
          def request(path, method='GET', payload=None, timeout=240):
              body=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(BASE+path,data=body,method=method,headers={'Accept':'application/json','Content-Type':'application/json; charset=utf-8','User-Agent':'TakeOff-CI/0.14.1'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  raise RuntimeError(f'HTTP {e.code}: {raw[:300]}')
          code,health=request('/health',timeout=30)
          assert code==200 and health.get('ok') is True,health
          assert health.get('stateless') is True and health.get('job_api') is True,health
          assert health.get('gemini') is True,health
          assert health.get('version')=='0.14.1',health
          assert health.get('learning_store')=='supabase_verified_anon_rls',health
          print('health=',health)
          code,created=request('/v2/viral-jobs','POST',{'url':REEL,'niche':'عمومی','source':'github_full_e2e'},45)
          assert 200<=code<300,created
          job_id=created.get('job_id',''); token=created.get('poll_token','')
          assert job_id and len(token)>=20,created
          assert created.get('stage')=='server_prepare',created
          print('created job',job_id)
          seen=['server_prepare']; last_overall=int(created.get('overall_progress_percent') or 0); completed=False
          for n in range(1,121):
              code,row=request(f'/v2/viral-jobs/{job_id}/poll','POST',{'token':token},240)
              assert 200<=code<300,row
              status=row.get('status'); stage=row.get('stage'); sp=row.get('stage_progress_percent'); op=row.get('overall_progress_percent')
              assert stage in stages,(stage,row)
              assert isinstance(sp,int) and 0<=sp<=100,(sp,row)
              assert isinstance(op,int) and 0<=op<=100,(op,row)
              assert op>=last_overall,(last_overall,op,row)
              last_overall=op
              if stage not in seen: seen.append(stage)
              print(f'poll={n} status={status} stage={stage} stage_pct={sp} overall={op} bytes={row.get("media_downloaded_bytes",0)}/{row.get("media_total_bytes",0)} retryable={row.get("retryable",False)}')
              if status=='failed': raise RuntimeError('live backend failed: '+str(row.get('error_code')))
              if status=='completed':
                  assert stage=='completed' and op==100 and sp==100,row
                  result=row.get('result') or {}; report=result.get('report') or {}
                  assert result.get('analysis_mode')=='vercel_stateless_gemini_apify_real_progress',result
                  assert result.get('learning_persisted') is True,result
                  assert isinstance(result.get('audio_visual_analysis'),dict) and result.get('audio_visual_analysis'),result
                  assert isinstance(result.get('behavioral_analysis'),dict) and result.get('behavioral_analysis'),result
                  assert isinstance(report,dict) and report,report
                  completed=True
                  break
              next_token=row.get('poll_token','')
              assert isinstance(next_token,str) and len(next_token)>=20,row
              assert next_token!=token,'poll token did not rotate'
              token=next_token
              time.sleep(max(0.9,float(row.get('retry_after_seconds') or 0)))
          assert completed,'full live analysis did not complete'
          required={'server_prepare','media_resolve','media_download','ai_upload','audio_visual_analysis','behavioral_analysis','learning_persist','completed'}
          assert required.issubset(set(seen)),(required-set(seen),seen)
          print('FULL_LIVE_E2E_GREEN stages=',seen)
          PY

      - name: Discover Android version from source
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          text=pathlib.Path('app/build.gradle.kts').read_text(encoding='utf-8'); name=re.search(r'versionName\s*=\s*"([^"]+)"',text); code=re.search(r'versionCode\s*=\s*(\d+)',text)
          if not name or not code: raise SystemExit('Could not discover versionName/versionCode')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write(f'TAKEOFF_VERSION_NAME={name.group(1)}\nTAKEOFF_VERSION_CODE={code.group(1)}\n')
          print(f'TakeOff Insights {name.group(1)} ({code.group(1)})')
          PY

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Android unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Validate APK installability and release contract
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'; test -s "$APK"; unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"; SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='ai.takeoff.insightscompanion' versionCode='$TAKEOFF_VERSION_CODE' versionName='$TAKEOFF_VERSION_NAME'" /tmp/apk-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/apk-manifest.txt
          grep -q 'ShareEntryActivity' /tmp/apk-manifest.txt; grep -q 'ViralShareActivity' /tmp/apk-manifest.txt; grep -q 'android.intent.action.SEND' /tmp/apk-manifest.txt
          ! grep -q 'SilentPairActivity' /tmp/apk-manifest.txt; ! grep -q 'ViralCaptureService' /tmp/apk-manifest.txt; ! grep -q 'android.permission.RECORD_AUDIO' /tmp/apk-manifest.txt

      - name: Write immutable build report
        if: always() && !cancelled()
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY'
          import hashlib,json,os,pathlib
          apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk'); payload={'github_run_id':os.getenv('GITHUB_RUN_ID'),'github_sha':os.getenv('GITHUB_SHA'),'version_name':os.getenv('TAKEOFF_VERSION_NAME'),'version_code':int(os.getenv('TAKEOFF_VERSION_CODE') or 0),'apk_exists':apk.is_file() and apk.stat().st_size>0,'apk_size':apk.stat().st_size if apk.is_file() else 0,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest() if apk.is_file() else None,'source_policy':'vercel-0.14.1-stateless-real-progress-supabase-learning-full-e2e-before-build'}
          pathlib.Path('reports/android-build-status.json').write_text(json.dumps(payload,indent=2),encoding='utf-8'); print(json.dumps(payload,indent=2))
          PY
          cp /tmp/apk-badging.txt reports/apk-badging.txt 2>/dev/null || true; cp /tmp/apk-manifest.txt reports/apk-manifest.txt 2>/dev/null || true

      - name: Upload diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with: {name: 'TakeOff-Android-Diagnostics-${{ github.run_id }}', path: 'reports/', if-no-files-found: error, retention-days: 30}
      - name: Upload validated APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with: {name: 'TakeOff-Insights-v${{ env.TAKEOFF_VERSION_NAME }}-${{ github.run_id }}', path: 'app/build/outputs/apk/debug/app-debug.apk', if-no-files-found: error, retention-days: 30}
      - name: Publish permanent validated release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'; ASSET='TakeOff-Insights.apk'; TAG="v${TAKEOFF_VERSION_NAME}"; cp "$APK" "$ASSET"; SHA256=$(sha256sum "$ASSET"|awk '{print $1}')
          NOTES=$(printf 'Validated TakeOff Insights %s (code %s)\n\nPackage: ai.takeoff.insightscompanion\nSHA-256: %s\n\nVercel 0.14.1 Job API: real Reel media resolution/download, Gemini multimodal analysis, real stage progress, verified Supabase learning persistence, Android unit tests, signature and manifest gates passed.' "$TAKEOFF_VERSION_NAME" "$TAKEOFF_VERSION_CODE" "$SHA256")
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$ASSET" --clobber; gh release edit "$TAG" --title "TakeOff Insights $TAKEOFF_VERSION_NAME" --notes "$NOTES" --latest; else gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "TakeOff Insights $TAKEOFF_VERSION_NAME" --notes "$NOTES" --latest; fi
