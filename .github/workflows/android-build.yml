name: TakeOff Android v0.14.2 Public Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: takeoff-android-v0142-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: DADSTAN source gate
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "0.14.2"' app/build.gradle.kts
          grep -q 'https://takeoff-seven-puce.vercel.app' "$SRC/PayloadClient.kt"
          grep -q '/v2/viral-jobs' "$SRC/ViralJobClient.kt"
          grep -q '/poll' "$SRC/ViralJobClient.kt"
          grep -q 'ViralJobClient.analyze(PayloadClient.PRODUCTION_ENDPOINT' "$SRC/ViralShareActivity.kt"
          test -s "$SRC/ViralStreamClient.kt"
          grep -q 'const val PRODUCTION_ENDPOINT = PayloadClient.PRODUCTION_ENDPOINT' "$SRC/ViralStreamClient.kt"
          ! grep -Rni 'android.permission.RECORD_AUDIO' app/src/main
          ! grep -RniE 'OPENAI_API_KEY|api\.openai\.com|/v2/viral-stream|LegacyCompanionRepair|SilentPairActivity' app/src/main
          if grep -RniE --exclude='*Test.kt' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})' app; then
            echo 'Potential secret found in public Android source' >&2
            exit 1
          fi

      - name: Production backend health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://takeoff-seven-puce.vercel.app/health',headers={'Accept':'application/json','User-Agent':'TakeOff-DADSTAN/0.14.2'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=json.loads(r.read().decode())
          assert body.get('ok') is True, body
          assert body.get('gemini') is True, body
          assert body.get('job_api') is True, body
          assert body.get('stateless') is True, body
          assert body.get('learning_store') == 'supabase_verified_anon_rls', body
          print(json.dumps(body,ensure_ascii=False))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clean unit tests and APK build
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: DADSTAN APK forensic verification
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='ai.takeoff.insightscompanion' versionCode='30' versionName='0.14.2'" apk-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'ViralShareActivity' apk-manifest.txt
          grep -q 'android.intent.action.SEND' apk-manifest.txt
          ! grep -q 'android.permission.RECORD_AUDIO' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          stat -c 'APK_SIZE=%s' "$APK" | tee apk-size.txt

      - name: Publish validated test APK release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk TakeOff-Insights.apk
          SHA256=$(sha256sum TakeOff-Insights.apk | awk '{print $1}')
          SIZE=$(stat -c '%s' TakeOff-Insights.apk)
          NOTES=$(printf 'TakeOff Insights 0.14.2 (code 30)\n\nPackage: ai.takeoff.insightscompanion\nBackend: Vercel + Gemini + Supabase\nSHA-256: %s\nSize: %s bytes\n\nDADSTAN gates: unit tests, clean build, ZIP integrity, APK signature, package/version, SEND share intent, and no RECORD_AUDIO verified.' "$SHA256" "$SIZE")
          if gh release view v0.14.2 >/dev/null 2>&1; then
            gh release upload v0.14.2 TakeOff-Insights.apk --clobber
            gh release edit v0.14.2 --title 'TakeOff Insights 0.14.2' --notes "$NOTES" --latest
          else
            gh release create v0.14.2 TakeOff-Insights.apk --target "$GITHUB_SHA" --title 'TakeOff Insights 0.14.2' --notes "$NOTES" --latest
          fi
