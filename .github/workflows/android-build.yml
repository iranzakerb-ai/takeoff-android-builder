# DADSTAN release gate refresh for verified v0.15.3 source
name: TakeOff Android v0.15.3 DADSTAN Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'PRODUCT_CONSTITUTION.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: takeoff-android-v0153-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dadstan-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: DADSTAN source, mission and security gate
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'

          # Release identity
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'versionName = "0.15.3"' app/build.gradle.kts

          # Product constitution is mandatory and must preserve both learning loops.
          test -s PRODUCT_CONSTITUTION.md
          test -s AGENTS.md
          grep -q 'TWO-MISSION LOCK' PRODUCT_CONSTITUTION.md
          grep -q 'Owner Outcome Capture' PRODUCT_CONSTITUTION.md
          grep -q 'Viral Reel Learning' PRODUCT_CONSTITUTION.md
          grep -q 'north-star optimization target' PRODUCT_CONSTITUTION.md
          grep -q 'PRODUCT_CONSTITUTION.md' AGENTS.md

          # The primary UX must expose the two user jobs, not an engineering console.
          grep -q 'ثبت آمار ریلزهای خودمان' "$SRC/GlassHomeActivity.kt"
          grep -q 'ریلز میلیونی را Share کن' "$SRC/GlassHomeActivity.kt"
          grep -q 'دو کار. یک حلقه یادگیری.' "$SRC/GlassHomeActivity.kt"
          ! grep -q 'V4 LEARNING CONSOLE' "$SRC/GlassHomeActivity.kt"
          grep -q 'یادگیری از ریلزهای وایرال' "$SRC/ViralShareActivity.kt"

          # A completed viral analysis must actually be readable by the owner.
          test -s "$SRC/ViralReportFormatter.kt"
          grep -q 'هوک / قلاب' "$SRC/ViralReportFormatter.kt"
          grep -q 'سناریوی بازسازی‌شده' "$SRC/ViralReportFormatter.kt"
          grep -q 'داستان و ساختار روایی' "$SRC/ViralReportFormatter.kt"
          grep -q 'دیالوگ و متن' "$SRC/ViralReportFormatter.kt"
          grep -q 'چرا احتمالاً وایرال شده' "$SRC/ViralReportFormatter.kt"
          grep -q 'الگوهای قابل استفاده دوباره' "$SRC/ViralReportFormatter.kt"
          grep -q 'ViralReportFormatter.full' "$SRC/ViralShareActivity.kt"
          test -s app/src/test/java/ai/takeoff/insightscompanion/ViralReportFormatterTest.kt

          # Owner/edge and public viral runtime are intentionally separated.
          grep -q 'https://takeoff-seven-puce.vercel.app' "$SRC/PayloadClient.kt"
          grep -q 'https://takeoff-virality-engine.onrender.com' "$SRC/PayloadClient.kt"

          # Public Instagram learning must be credential-free, including migration of old dead letters.
          grep -q 'processPublicFallback' "$SRC/SharedMediaWorker.kt"
          ! grep -q 'queue.fail(localId, "companion_credential_required"' "$SRC/SharedMediaWorker.kt"
          grep -q 'recoverLegacyCredentialFailures' "$SRC/SharedMediaQueue.kt"
          grep -q 'recoverLegacyCredentialFailures' "$SRC/GlassHomeActivity.kt"
          grep -q 'recoverLegacyCredentialFailures' "$SRC/ViralShareActivity.kt"

          # Existing Android contracts.
          grep -q 'GlassHomeActivity' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND_MULTIPLE' app/src/main/AndroidManifest.xml
          test -s "$SRC/SharedMediaClient.kt"
          test -s "$SRC/SharedMediaQueue.kt"
          test -s "$SRC/SharedMediaWorker.kt"
          test -s "$SRC/ServerOcrClient.kt"
          grep -q 'private const val LANES = 3' "$SRC/SharedMediaWorker.kt"
          grep -q 'enqueueContinuation' "$SRC/SharedMediaWorker.kt"
          grep -q 'X-Takeoff-Companion-Key' "$SRC/SharedMediaClient.kt"
          grep -q 'SharedMediaClient.status(endpoint, item.jobId!!, item.pollToken!!, companionKey)' "$SRC/ViralShareActivity.kt"
          grep -q '۱٫۲ میلیون' app/src/test/java/ai/takeoff/insightscompanion/MetricParserLargeCountTest.kt
          grep -q '۲٫۵ میلیارد' app/src/test/java/ai/takeoff/insightscompanion/MetricParserLargeCountTest.kt
          grep -q 'instagram.com/p/XYZ-9' app/src/test/java/ai/takeoff/insightscompanion/SharedMediaQueueContractTest.kt

          # Security boundaries.
          ! grep -Rni 'android.permission.RECORD_AUDIO' app/src/main
          ! grep -RniE 'OPENAI_API_KEY|api\.openai\.com|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}' app/src/main

      - name: Production V4 backend health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://takeoff-virality-engine.onrender.com/v4/media-jobs/health',headers={'Accept':'application/json','User-Agent':'TakeOff-DADSTAN/0.15.3'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=json.loads(r.read().decode())
          assert body.get('ok') is True, body
          assert body.get('durable_queue') is True, body
          assert body.get('gemini') is True, body
          assert body.get('apify') is True, body
          assert body.get('authenticated_jobs') is True, body
          assert body.get('stepwise_processing') is True, body
          supported=set(body.get('supported_media') or [])
          assert {'reel','video_post','photo','carousel','mixed'} <= supported, body
          assert int(body.get('max_source_bytes_per_video') or 0) >= 220*1024*1024, body
          print(json.dumps(body,ensure_ascii=False))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests, lint and clean APK build
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: DADSTAN APK forensic verification
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='ai.takeoff.insightscompanion' versionCode='34' versionName='0.15.3'" apk-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'GlassHomeActivity' apk-manifest.txt
          grep -q 'ViralShareActivity' apk-manifest.txt
          grep -q 'android.intent.action.SEND' apk-manifest.txt
          grep -q 'android.intent.action.SEND_MULTIPLE' apk-manifest.txt
          ! grep -q 'android.permission.RECORD_AUDIO' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          stat -c 'APK_SIZE=%s' "$APK" | tee apk-size.txt
          cp "$APK" TakeOff-Insights-v0.15.3.apk

      - name: Upload validated APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TakeOff-Insights-v0.15.3
          path: TakeOff-Insights-v0.15.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish DADSTAN-approved APK release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk TakeOff-Insights.apk
          SHA256=$(sha256sum TakeOff-Insights.apk | awk '{print $1}')
          SIZE=$(stat -c '%s' TakeOff-Insights.apk)
          NOTES=$(printf 'TakeOff Insights 0.15.3 (code 34)\n\nMission lock: (1) Owner Outcome capture as Meta API substitute; (2) public viral-Reel learning.\nViral report fix: completed analyses now expose hook, first seconds, story, reconstructed scenario, timeline, dialogue, CTA, visual/editing/audio analysis, behavioral mechanisms, retention hypotheses, likely virality explanations, reusable patterns, evidence quality and uncertainties.\nCompatibility: report renderer walks V4, public resilient, nested legacy and stringified JSON evidence instead of hiding valid saved analysis behind a schema mismatch.\nUX: simplified Persian glassmorphism with exactly two primary jobs; analysis dialog is readable and selectable.\nLegacy companion_credential_required queue items: auto-recovered through the credential-free public evidence path.\nBackend: durable V4 Render runtime + Vercel owner/edge path + Gemini + Apify + durable Postgres store.\nPrivate Owner data: companion credential remains required.\nNorth star: improve million-view performance; no guaranteed reach claim.\nSHA-256: %s\nSize: %s bytes\n\nDADSTAN PASS requires: two-mission constitution gate, complete viral-report contract tests, source/security gate, live durable V4 health, unit tests, lint, clean build, ZIP integrity, APK signature, package/version, GlassHome launcher, SEND + SEND_MULTIPLE, and no RECORD_AUDIO.' "$SHA256" "$SIZE")
          if gh release view v0.15.3 >/dev/null 2>&1; then
            gh release upload v0.15.3 TakeOff-Insights.apk --clobber
            gh release edit v0.15.3 --title 'TakeOff Insights 0.15.3' --notes "$NOTES" --latest
          else
            gh release create v0.15.3 TakeOff-Insights.apk --target "$GITHUB_SHA" --title 'TakeOff Insights 0.15.3' --notes "$NOTES" --latest
          fi
