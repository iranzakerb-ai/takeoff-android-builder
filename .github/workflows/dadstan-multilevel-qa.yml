name: TakeOff Multi-Level QA + DADSTAN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dadstan-multilevel-qa.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: L1 Smoke / Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

  unit_lint:
    name: L2 Unit + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

  contract_security:
    name: L3 Contract + Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Product and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'versionName = "0.15.3"' app/build.gradle.kts
          test -s PRODUCT_CONSTITUTION.md
          test -s AGENTS.md
          grep -q 'TWO-MISSION LOCK' PRODUCT_CONSTITUTION.md
          grep -q 'Owner Outcome Capture' PRODUCT_CONSTITUTION.md
          grep -q 'Viral Reel Learning' PRODUCT_CONSTITUTION.md
          grep -q 'GlassHomeActivity' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND_MULTIPLE' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'private val primary = Color.rgb(255, 122, 26)' "$SRC/MainActivity.kt"
          grep -q 'DecelerateInterpolator' "$SRC/MainActivity.kt"
          grep -q 'processPublicFallback' "$SRC/SharedMediaWorker.kt"
          grep -q 'recoverLegacyCredentialFailures' "$SRC/SharedMediaQueue.kt"
          grep -q 'trimCompletedItems' "$SRC/SharedMediaQueue.kt"
      - name: Adversarial secret and permission scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rni 'android.permission.RECORD_AUDIO' app/src/main
          ! grep -RniE 'OPENAI_API_KEY|api\.openai\.com|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}' app/src/main
          ! grep -RniE 'password\s*=\s*"[^" ]+"|secret\s*=\s*"[^" ]+"' app/src/main/java || true

  backend_live:
    name: L4 Live Backend Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production V4 health repeatedly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          url='https://takeoff-virality-engine.onrender.com/v4/media-jobs/health'
          for i in range(3):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'TakeOff-MultiQA/0.15.3'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  body=json.loads(r.read().decode())
              assert body.get('ok') is True, body
              assert body.get('durable_queue') is True, body
              assert body.get('gemini') is True, body
              assert body.get('apify') is True, body
              assert body.get('authenticated_jobs') is True, body
              assert body.get('stepwise_processing') is True, body
              supported=set(body.get('supported_media') or [])
              assert {'reel','video_post','photo','carousel','mixed'} <= supported, body
              print('health-pass', i+1, json.dumps(body,ensure_ascii=False))
              time.sleep(3)
          PY

  apk_forensics:
    name: L5 Clean Build + APK Forensics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Clean build
        run: gradle --no-daemon clean :app:assembleDebug
      - name: APK forensic checks
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='ai.takeoff.insightscompanion' versionCode='34' versionName='0.15.3'" apk-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'GlassHomeActivity' apk-manifest.txt
          grep -q 'ViralShareActivity' apk-manifest.txt
          grep -q 'android.intent.action.SEND' apk-manifest.txt
          grep -q 'android.intent.action.SEND_MULTIPLE' apk-manifest.txt
          grep -q 'android.permission.POST_NOTIFICATIONS' apk-manifest.txt
          ! grep -q 'android.permission.RECORD_AUDIO' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          stat -c 'APK_SIZE=%s' "$APK" | tee apk-size.txt

  dadstan:
    name: L6 DADSTAN Final Judge
    needs: [smoke, unit_lint, contract_security, backend_live, apk_forensics]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final verdict
        env:
          SMOKE: ${{ needs.smoke.result }}
          UNIT_LINT: ${{ needs.unit_lint.result }}
          CONTRACT_SECURITY: ${{ needs.contract_security.result }}
          BACKEND_LIVE: ${{ needs.backend_live.result }}
          APK_FORENSICS: ${{ needs.apk_forensics.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'DADSTAN MULTI-LEVEL QA\n'
          printf 'L1 Smoke: %s\n' "$SMOKE"
          printf 'L2 Unit+Lint: %s\n' "$UNIT_LINT"
          printf 'L3 Contract+Security: %s\n' "$CONTRACT_SECURITY"
          printf 'L4 Backend Live: %s\n' "$BACKEND_LIVE"
          printf 'L5 APK Forensics: %s\n' "$APK_FORENSICS"
          test "$SMOKE" = success
          test "$UNIT_LINT" = success
          test "$CONTRACT_SECURITY" = success
          test "$BACKEND_LIVE" = success
          test "$APK_FORENSICS" = success
          echo 'DADSTAN VERDICT: PASS'
