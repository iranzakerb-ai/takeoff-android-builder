name: Build TakeOff Insights 0.20.7 Final

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: takeoff-v0207-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dadstan-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAKEOFF_PRODUCTION_ENDPOINT: https://takeoff-virality-engine.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: DADSTAN source contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='app/src/main/java/ai/takeoff/insightscompanion'
          grep -q 'versionCode = 67' app/build.gradle.kts
          grep -q 'versionName = "0.20.7"' app/build.gradle.kts
          grep -q 'GlassHomeActivity' app/src/main/AndroidManifest.xml
          grep -q 'ScenarioStudioActivity' app/src/main/AndroidManifest.xml
          grep -q 'AiVideoStudioActivity' app/src/main/AndroidManifest.xml
          grep -q 'ViralShareActivity' app/src/main/AndroidManifest.xml
          grep -q 'LocalStudioEngine' "$SRC/LocalStudioEngine.kt"
          grep -q 'LocalStudioEngine.generateAiVideoPackage' "$SRC/AiVideoStudioActivity.kt"
          grep -q 'LocalStudioEngine.generateScenarioPackage' "$SRC/ScenarioStudioActivity.kt"
          grep -q 'LocalStudioEngine' "$SRC/StudioTaskWorker.kt"
          grep -q 'SharedMediaNotifier.notifyReelReceived' "$SRC/SharedMediaWorker.kt"
          grep -q 'android.intent.action.SEND' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.SEND_MULTIPLE' app/src/main/AndroidManifest.xml
          ! grep -Rni 'android.permission.RECORD_AUDIO' app/src/main
          grep -q 'Semaphore(1, true)' "$SRC/SharedMediaWorker.kt"
          ! grep -q 'takeoff-v4-media-lane-' "$SRC/SharedMediaWorker.kt"
          grep -q 'ExistingWorkPolicy.APPEND_OR_REPLACE' "$SRC/SharedMediaWorker.kt"
          grep -q 'attempts: Int = 2' "$SRC/SharedMediaClient.kt"
          grep -q '/v4/media-jobs/${enc(jobId)}/status' "$SRC/SharedMediaClient.kt"
          grep -q 'markTransient' "$SRC/SharedMediaQueue.kt"
          grep -q '/v4/scenario-studio/generate' "$SRC/ScenarioStudioActivity.kt"
          grep -q '/v4/ai-video-studio/generate' "$SRC/AiVideoStudioActivity.kt"
          ! grep -RniE 'OPENAI_API_KEY|GROQ_API_KEY|OPENROUTER_API_KEY|GEMINI_API_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}' app/src/main
          echo 'DADSTAN_SOURCE_CONTRACT=PASS'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle --no-daemon clean :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build final release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: DADSTAN APK forensic verification
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='ai.takeoff.insightscompanion' versionCode='67' versionName='0.20.7'" apk-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q 'GlassHomeActivity' apk-manifest.txt
          grep -q 'ScenarioStudioActivity' apk-manifest.txt
          grep -q 'AiVideoStudioActivity' apk-manifest.txt
          grep -q 'ViralShareActivity' apk-manifest.txt
          grep -q 'android.intent.action.SEND' apk-manifest.txt
          grep -q 'android.intent.action.SEND_MULTIPLE' apk-manifest.txt
          ! grep -q 'android.permission.RECORD_AUDIO' apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          stat -c 'APK_SIZE=%s' "$APK" | tee apk-size.txt
          cp "$APK" TakeOff-Insights-0.20.7.apk
          echo 'DADSTAN_APK_FORENSICS=PASS'

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakeOff-Insights-0.20.7
          path: TakeOff-Insights-0.20.7.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload forensic reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakeOff-Insights-0.20.7-forensics
          path: |
            apk-badging.txt
            apk-signing.txt
            apk-manifest.txt
            apk-sha256.txt
            apk-size.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.20.7
          name: "TakeOff Insights v0.20.7 (Build 67 — Parallel 5-Lane & Silent DM Learning)"
          body: |
            ## TakeOff Insights v0.20.7 — Official Release
            - **Application ID**: `ai.takeoff.insightscompanion`
            - **Version Name**: `0.20.7`
            - **Version Code**: `66`
            - **Launcher**: `GlassHomeActivity`
            - **Signing**: `DEBUG-SIGNED SIDELOAD RELEASE` (`CN=Android Debug`, APK Signature Scheme v2)
            - **Features**: 5-Lane Parallel Queue, In-App Live Notifications, Direct Queue Entry Card, Silent DM Inbox Processor
            - **Audit**: DADSTAN Forensic Gate PASSED
          files: |
            TakeOff-Insights-0.20.7.apk
            apk-badging.txt
            apk-signing.txt
            apk-manifest.txt
            apk-sha256.txt
            apk-size.txt
